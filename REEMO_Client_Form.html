<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Re:Emo — Form</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0A0C14;--surface:#12141E;--surface2:#1A1C28;--surface3:#222438;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#EDE8E0;--muted:rgba(237,232,224,0.45);--dim:rgba(237,232,224,0.25);
  --gold:#D4A84B;--gold-lt:rgba(212,168,75,0.15);--mint:#6AB890;--mint-lt:rgba(106,184,144,0.12);
}
html{font-size:16px;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;line-height:1.6;padding:0;}
.wrap{max-width:560px;margin:0 auto;padding:32px 22px 80px;}
.brand{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);text-align:center;margin-bottom:30px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:28px;padding:30px 26px;}
h1{font-family:'EB Garamond',serif;font-weight:500;font-size:30px;line-height:1.2;margin-bottom:8px;}
.desc{color:var(--muted);font-size:15px;margin-bottom:8px;}
.intro{color:var(--muted);font-size:13.5px;border-top:1px solid var(--border);margin-top:22px;padding-top:18px;}
.q{margin-top:26px;}
.q-label{font-size:15.5px;font-weight:500;margin-bottom:12px;display:block;}
.q-req{color:var(--gold);margin-left:3px;}
input[type=text],input[type=email],input[type=number],textarea{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:16px;padding:15px 16px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px;outline:none;transition:border-color .2s;}
input:focus,textarea:focus{border-color:var(--mint);}
textarea{min-height:110px;resize:vertical;}
.opt{display:flex;align-items:center;gap:13px;background:var(--surface2);border:1px solid var(--border2);border-radius:16px;padding:15px 16px;margin-bottom:10px;cursor:pointer;transition:all .15s;}
.opt:active{transform:scale(0.99);}
.opt.sel{border-color:var(--mint);background:var(--mint-lt);}
.opt-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;position:relative;transition:all .15s;}
.opt.sel .opt-dot{border-color:var(--mint);}
.opt.sel .opt-dot::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--mint);}
.opt-sq{border-radius:6px;}
.opt.sel .opt-sq::after{border-radius:2px;}
.opt-text{font-size:15px;}
.scale{display:flex;gap:8px;flex-wrap:wrap;}
.scale-btn{flex:1;min-width:44px;background:var(--surface2);border:1px solid var(--border2);border-radius:14px;padding:14px 4px;text-align:center;font-size:16px;cursor:pointer;transition:all .15s;font-family:'Space Mono',monospace;}
.scale-btn.sel{border-color:var(--mint);background:var(--mint-lt);color:var(--mint);}
.scale-cap{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:7px;}
.btn{width:100%;background:var(--gold);color:#1A1206;border:none;border-radius:18px;padding:17px;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:600;cursor:pointer;margin-top:30px;transition:opacity .2s;}
.btn:active{opacity:.85;}
.btn:disabled{opacity:.5;cursor:default;}
.state{text-align:center;padding:60px 26px;}
.state-icon{font-size:46px;margin-bottom:18px;}
.state h2{font-family:'EB Garamond',serif;font-weight:500;font-size:26px;margin-bottom:10px;}
.state p{color:var(--muted);font-size:15px;}
.err{color:#E8896A;font-size:13.5px;margin-top:14px;text-align:center;min-height:18px;}
.foot{text-align:center;color:var(--dim);font-size:11px;margin-top:26px;font-family:'Space Mono',monospace;letter-spacing:1px;}
.loading{text-align:center;color:var(--muted);padding:80px 20px;font-size:15px;}
.priv{background:var(--surface2);border-radius:14px;padding:13px 15px;margin-top:20px;font-size:12px;color:var(--muted);line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Re:Emo</div>
  <div id="root"><div class="loading">Loading your form…</div></div>
  <div class="foot">Your responses are private and shared only with your care provider.</div>
</div>

<script>
const SUPABASE_URL="https://torfsowsudppkbeeltqw.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvcmZzb3dzdWRwcGtiZWVsdHF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0ODgxOTMsImV4cCI6MjA5NjA2NDE5M30.1kOLgB9IbLJeX0W9Ht0iOO9x9Cgv4lqeU4NoijXIR4E";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const root=document.getElementById('root');
let SCHEMA=[], TOKEN=null, answers={};

function esc(s){if(s==null)return '';return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function getToken(){const u=new URL(location.href);return u.searchParams.get('t')||u.searchParams.get('token');}

async function init(){
  TOKEN=getToken();
  if(!TOKEN){return showState('🌱','Welcome','This link is incomplete. Please use the exact link your provider sent you.');}
  try{
    const {data,error}=await sb.rpc('get_form_by_token',{p_token:TOKEN});
    if(error)throw error;
    const f=Array.isArray(data)?data[0]:data;
    if(!f){throw new Error('Form not found.');}
    if(f.already_done){return showState('✓','All done','You\'ve already completed this form. Thank you — there\'s nothing more to do.');}
    SCHEMA=Array.isArray(f.schema)?f.schema:[];
    renderForm(f.title,f.description);
  }catch(e){
    console.warn('[reemo-form] get_form_by_token failed:',e&&(e.message||e),e);
    showState('🍃','Link not valid','We couldn\'t open this form. The link may have expired or already been used. Please check with your provider.');
  }
}

function renderForm(title,description){
  let h='<div class="card"><h1>'+esc(title)+'</h1>'+(description?'<div class="desc">'+esc(description)+'</div>':'')+
    '<div class="intro">Please answer honestly — there are no right or wrong answers. Take your time.</div>';
  SCHEMA.forEach((q,i)=>{ h+=renderQ(q,i); });
  h+='<div class="err" id="err"></div>'+
     '<button class="btn" id="submitBtn" onclick="submitForm()">Submit</button>'+
     '<div class="priv">By submitting, you agree your answers are shared with your care provider at their organisation. Your information is kept private and handled according to their privacy practices.</div>'+
     '</div>';
  root.innerHTML=h;
}

function renderQ(q,i){
  const req=q.required?'<span class="q-req">*</span>':'';
  let body='';
  const type=q.type||'text';
  if(type==='text'){
    body='<input type="text" oninput="setAns('+i+',this.value)" />';
  }else if(type==='long'){
    body='<textarea oninput="setAns('+i+',this.value)"></textarea>';
  }else if(type==='number'){
    body='<input type="number" oninput="setAns('+i+',this.value)" />';
  }else if(type==='yesno'){
    body=['Yes','No'].map(o=>optHtml(i,o,false)).join('');
  }else if(type==='choice'){
    body=(q.options||[]).map(o=>optHtml(i,o,false)).join('');
  }else if(type==='multi'){
    body=(q.options||[]).map(o=>optHtml(i,o,true)).join('');
  }else if(type==='scale'){
    const min=q.min!=null?q.min:0, max=q.max!=null?q.max:3;
    let s='<div class="scale">';
    for(let v=min;v<=max;v++) s+='<div class="scale-btn" id="sc_'+i+'_'+v+'" onclick="setScale('+i+','+v+')">'+v+'</div>';
    s+='</div><div class="scale-cap"><span>'+esc(q.minLabel||'')+'</span><span>'+esc(q.maxLabel||'')+'</span></div>';
    body=s;
  }
  return '<div class="q"><label class="q-label">'+esc(q.label||('Question '+(i+1)))+req+'</label>'+body+'</div>';
}

function optHtml(qi,opt,multi){
  const cls=multi?'opt-dot opt-sq':'opt-dot';
  return '<div class="opt" id="opt_'+qi+'_'+cssEsc(opt)+'" onclick="toggleOpt('+qi+',\''+jsEsc(opt)+'\','+multi+')"><div class="'+cls+'"></div><div class="opt-text">'+esc(opt)+'</div></div>';
}
function cssEsc(s){return String(s).replace(/[^a-zA-Z0-9]/g,'_');}
function jsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

function setAns(i,v){answers[i]=v;}
function setScale(i,v){
  answers[i]=v;
  const q=SCHEMA[i];const min=q.min!=null?q.min:0,max=q.max!=null?q.max:3;
  for(let x=min;x<=max;x++)document.getElementById('sc_'+i+'_'+x).classList.toggle('sel',x===v);
}
function toggleOpt(qi,opt,multi){
  if(multi){
    if(!Array.isArray(answers[qi]))answers[qi]=[];
    const idx=answers[qi].indexOf(opt);
    if(idx>=0)answers[qi].splice(idx,1);else answers[qi].push(opt);
    document.getElementById('opt_'+qi+'_'+cssEsc(opt)).classList.toggle('sel');
  }else{
    answers[qi]=opt;
    (SCHEMA[qi].type==='yesno'?['Yes','No']:(SCHEMA[qi].options||[])).forEach(o=>{
      document.getElementById('opt_'+qi+'_'+cssEsc(o)).classList.toggle('sel',o===opt);
    });
  }
}

function computeScore(){
  // If every answered question is a numeric scale, sum them (PHQ-9/GAD-7 style).
  let sum=0,allScale=true,any=false;
  SCHEMA.forEach((q,i)=>{
    if(q.type==='scale'){ if(typeof answers[i]==='number'){sum+=answers[i];any=true;} }
    else { if(answers[i]!=null && answers[i]!=='') allScale=false; }
  });
  return (allScale && any)?sum:null;
}

async function submitForm(){
  // validate required
  for(let i=0;i<SCHEMA.length;i++){
    const q=SCHEMA[i];
    if(q.required){
      const a=answers[i];
      const empty=(a==null||a===''||(Array.isArray(a)&&!a.length));
      if(empty){document.getElementById('err').textContent='Please answer: '+(q.label||('question '+(i+1)));window.scrollTo({top:0,behavior:'smooth'});return;}
    }
  }
  const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Submitting…';
  // build a labelled answers object
  const out={};
  SCHEMA.forEach((q,i)=>{ out[q.label||('q'+i)]=answers[i]!=null?answers[i]:''; });
  const score=computeScore();
  try{
    const {error}=await sb.rpc('submit_form_response',{p_token:TOKEN,p_answers:out,p_score:score});
    if(error)throw error;
    showState('✓','Thank you','Your responses have been received and shared securely with your provider. You can close this page now.');
  }catch(e){
    btn.disabled=false;btn.textContent='Submit';
    document.getElementById('err').textContent=(e.message||'').includes('already')?'This form was already submitted.':'Something went wrong. Please try again.';
  }
}

function showState(icon,title,msg){
  root.innerHTML='<div class="card"><div class="state"><div class="state-icon">'+icon+'</div><h2>'+esc(title)+'</h2><p>'+esc(msg)+'</p></div></div>';
}

init();
</script>
</body>
</html>
